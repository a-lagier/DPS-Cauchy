out_dir: ./generated_data
device: cuda:0
sampling_size: 256 # if conditional choose it accordingly with dataset image size
model: unet
ckpt_file: ./models/ffhq_10m.pt
steps: 10
seed: 1
batch_size: 1
channels: 3
conditional:
  use_conditional: True
  dataset: samples/
  dataset_dir: ./datasets/
  scale: 1.2
  operator:
    name: super-resolution
    resolution_factor: 0.5
    mask_type: box # random or box
    mask_size: 100
    mask_density: 0.9
    kernel_size : 60
    intensity: 1.0
  noise:
    name: gaussian
    rate: 1.0
    std: 0.05
metric:
  name: psnr